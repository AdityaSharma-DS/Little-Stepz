# Postgres for the Little Stepz website (storefront, admin, mobile API). The same file runs
# locally and on the VPS. Bound to 127.0.0.1 only: Docker bypasses UFW, so a bare "5432:5432"
# would put the database on the internet.
#
#   docker compose -f docker/website-postgres.compose.yml --env-file docker/.env up -d
#
# The CRM has its own container (docker/crm-postgres.compose.yml, port 5433); neither can see
# the other's data, and a restore or upgrade of one never touches the other.
name: little-stepz-website

services:
  ls-postgres:
    # Same major version as Neon (18.6): pg_dump output only restores into the same or a newer server.
    image: postgres:18-alpine
    container_name: ls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LS_DB_USER:-littlestepz}
      POSTGRES_PASSWORD: ${LS_DB_PASSWORD:?Set LS_DB_PASSWORD in docker/.env}
      POSTGRES_DB: ${LS_DB_NAME:-littlestepz}
      TZ: UTC
    ports:
      - "127.0.0.1:${LS_DB_PORT:-5432}:5432"
    # Postgres 18 images keep data in /var/lib/postgresql/18/docker and refuse a volume on .../data.
    volumes:
      - ls-pgdata:/var/lib/postgresql
    shm_size: 256mb
    # Sized for the 8 GB VPS shared with both website apps and the CRM.
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=50
      -c log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LS_DB_USER:-littlestepz} -d ${LS_DB_NAME:-littlestepz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ls-pgdata:
